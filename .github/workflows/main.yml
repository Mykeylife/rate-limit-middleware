name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python Quality and Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          
          # Enforce reproducible builds from the compiled lockfile
          echo "Installing from pinned lockfile for reproducibility..."
          python -m pip install -r requirements.lock
          
          # Bind package entrypoints natively
          python -m pip install -e .

      - name: Run static type checks with mypy
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          mypy --explicit-package-bases --namespace-packages -m gateway

      - name: Run lint with flake8
        run: |
          flake8 src tests

      - name: Run unit tests with strict 80% coverage gate
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          # Enforce strict 80% minimum coverage constraints cleanly
          pytest --cov=gateway --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
