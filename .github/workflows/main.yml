name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python Quality and Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect dependency file
        id: detect-deps
        run: |
          # Prefer requirements.txt; fallback to pyproject.toml
          if [ -f "requirements.txt" ]; then
            echo "dep-path=requirements.txt" >> "$GITHUB_OUTPUT"
            echo "Using requirements.txt"
          elif [ -f "pyproject.toml" ]; then
            echo "dep-path=pyproject.toml" >> "$GITHUB_OUTPUT"
            echo "Using pyproject.toml"
          else
            echo "No requirements.txt or pyproject.toml found in repository root."
            echo "Please add one of these files to install dependencies."
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Pass exactly the detected dependency file to the action
          cache-dependency-path: ${{ steps.detect-deps.outputs.dep-path }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          DEPS="${{ steps.detect-deps.outputs.dep-path }}"
          if [ "$DEPS" = "requirements.txt" ] && [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          elif [ "$DEPS" = "pyproject.toml" ] && [ -f "pyproject.toml" ]; then
            # Install the package in editable mode. This assumes your pyproject.toml
            # defines a PEP 517/518-compatible build backend and optional test extras if needed.
            python -m pip install -e .
          else
            echo "Dependency file detection mismatch; aborting."
            exit 1
          fi

      - name: Install quality tools
        run: |
          python -m pip install mypy flake8 pytest pytest-cov

      - name: Run static type checks with mypy
        run: |
          mypy src tests

      - name: Run lint with flake8
        run: |
          flake8 src tests

      - name: Run unit tests with coverage
        run: |
          # Run pytest exactly once; produce xml/html and terminal summary
          pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html

      - name: Publish coverage summary
        if: success()
        run: |
          echo "Coverage reports: coverage.xml and htmlcov/ (if generated)."
