name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python Quality and Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect dependency file
        id: detect-deps
        run: |
          if [ -f "requirements.txt" ]; then
            echo "dep-path=requirements.txt" >> "$GITHUB_OUTPUT"
            echo "Using requirements.txt"
          elif [ -f "pyproject.toml" ]; then
            echo "dep-path=pyproject.toml" >> "$GITHUB_OUTPUT"
            echo "Using pyproject.toml"
          else
            echo "No requirements.txt or pyproject.toml found in repository root."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ steps.detect-deps.outputs.dep-path }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ steps.detect-deps.outputs.dep-path }}" = "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -e .
          fi

      - name: Install quality tools
        run: |
          python -m pip install mypy flake8 pytest pytest-cov

      - name: Run static type checks with mypy
       env:
         MYPYPATH: ./src
  run: |
    mypy --config-file=pyproject.toml gateway

      - name: Run lint with flake8
        run: |
          flake8 src tests

      - name: Run unit tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
