name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python Quality and Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect dependency file
        id: detect-deps
        run: |
          if [ -f "requirements.lock" ]; then
            echo "dep-path=requirements.lock" >> "$GITHUB_OUTPUT"
            echo "Using requirements.lock"
          elif [ -f "pyproject.toml" ]; then
            echo "dep-path=pyproject.toml" >> "$GITHUB_OUTPUT"
            echo "Using pyproject.toml"
          else
            echo "No requirements.lock or pyproject.toml found in repository root."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ steps.detect-deps.outputs.dep-path }}

      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          # Fix: Keep structural tooling clean and separated
          python -m pip install mypy flake8 pytest pytest-cov Flake8-pyproject httpx
          
          # Enforce reproducible builds from the compiled lockfile
          if [ -f "requirements.lock" ]; then
            echo "Installing from pinned lockfile for safety..."
            python -m pip install -r requirements.lock
          fi
          
          # Bind package entrypoints natively
          python -m pip install -e .

      - name: Run static type checks with mypy
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          mypy --explicit-package-bases --namespace-packages -m gateway

      - name: Run lint with flake8
        run: |
          flake8 src tests

      - name: Run unit tests with strict 80% coverage gate
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          # Enforce strict 80% minimum coverage constraint to prevent regression failures
          pytest --cov=gateway --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
