name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python Quality and Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect dependency file
        id: detect-deps
        run: |
          if [ -f "requirements.txt" ]; then
            echo "dep-path=requirements.txt" >> "$GITHUB_OUTPUT"
            echo "Using requirements.txt"
          elif [ -f "pyproject.toml" ]; then
            echo "dep-path=pyproject.toml" >> "$GITHUB_OUTPUT"
            echo "Using pyproject.toml"
          else
            echo "No requirements.txt or pyproject.toml found in repository root."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ steps.detect-deps.outputs.dep-path }}

      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          # FIX: Added httpx explicitly to the installation pool for the TestClient environment
          python -m pip install mypy flake8 pytest pytest-cov Flake8-pyproject httpx
          
          # Force install the core app packages in editable mode to bind local paths natively
          if [ "${{ steps.detect-deps.outputs.dep-path }}" = "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -e .
          fi

      - name: Run static type checks with mypy
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          mypy --explicit-package-bases --namespace-packages -m gateway

      - name: Run lint with flake8
        run: |
          flake8 src tests

      - name: Run unit tests with coverage
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/src
          pytest --cov=gateway --cov-report=term-missing --cov-report=xml --cov-report=html
