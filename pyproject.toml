# ========================================================================
# Flake8 configuration - style and linting
# ========================================================================
[tool.flake8]
# Raise the line length limit to modern development standards
max-line-length = 120

# Ignore line length limits (E501) and trailing whitespaces (W291) entirely 
# to keep quality gates focused on critical bugs rather than strict aesthetics.
ignore = ["E501", "W291", "E203", "W503"]

# Exclude typical virtualenv, build, and test artifacts
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  ".eggs",
  ".git",
  ".github",
]
