[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-rate-limiter-gateway"
version = "0.1.0"
description = "Lightweight API Rate Limiter & Security Gateway Proxy (FastAPI)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Olanrewaju Micheal Akinbode", email = "mykeylife6@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.95",
  "uvicorn[standard]>=0.22",
  "pydantic>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.10",
  "flake8>=6.0",
  "black>=23.9",
  "isort>=5.12",
  "Flake8-pyproject>=1.2.3",
]

# ========================================================================
# Pytest configuration - test discovery and colored output
# ========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -r a --color=yes"
pythonpath = ["src"]

# ========================================================================
# mypy configuration - strict checks, target Python 3.11
# ========================================================================
[tool.mypy]
python_version = "3.11"

# Explicit root resolution rules to isolate imports cleanly
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

# Strictness configurations required by DataFactor
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

# ========================================================================
# Flake8 configuration - modern style limits to prevent E501 errors
# ========================================================================
[tool.flake8]
max-line-length = 120
ignore = ["E501", "W291", "E203", "W503", "F841"]
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  ".eggs",
  ".git",
  ".github",
]

# ========================================================================
# Black configuration - code formatter matching flake8 limits
# ========================================================================
[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = false

# ========================================================================
# isort configuration - import sorting
# ========================================================================
[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
multi_line_output = 3
include_trailing_comma = true
