[tool.mypy]
python_version = "3.11"

# Explicit root resolution rules to isolate imports cleanly
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

# Strictness configurations required by DataFactor
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

# ========================================================================
# Flake8 configuration - style and linting
# ========================================================================
[tool.flake8]
# Raise the line length limit to modern development standards
max-line-length = 120

# Ignore line length limits (E501) and trailing whitespaces (W291) entirely 
# to keep quality gates focused on critical bugs rather than strict aesthetics.
ignore = ["E501", "W291", "E203", "W503"]

# Exclude typical virtualenv, build, and test artifacts
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  ".eggs",
  ".git",
  ".github",
]
